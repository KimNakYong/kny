<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 레스토랑 예약 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }
        .btn-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
        }
        .btn-custom:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
            color: white;
            transform: translateY(-2px);
        }
        .login-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 0;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            margin-top: -50px;
            position: relative;
            z-index: 10;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .footer {
            background-color: #343a40;
            color: white;
            padding: 40px 0 20px;
        }
        .social-login {
            border-top: 1px solid #dee2e6;
            padding-top: 20px;
            margin-top: 20px;
        }
        .social-btn {
            width: 100%;
            margin-bottom: 10px;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }
        .btn-google {
            background-color: #db4437;
            color: white;
            border: none;
        }
        .btn-google:hover {
            background-color: #c23321;
            color: white;
        }
        .btn-facebook {
            background-color: #4267B2;
            color: white;
            border: none;
        }
        .btn-facebook:hover {
            background-color: #365899;
            color: white;
        }
        .btn-kakao {
            background-color: #FEE500;
            color: #000;
            border: none;
        }
        .btn-kakao:hover {
            background-color: #FDD800;
            color: #000;
        }
        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }
        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-utensils me-2"></i>레스토랑 예약 시스템
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/restaurants">레스토랑</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/reservations">예약</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/login">로그인</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/signup">회원가입</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="login-section">
        <div class="container text-center">
            <h1 class="display-4 fw-bold mb-4">로그인</h1>
            <p class="lead mb-5">계정에 로그인하고 편리한 예약 서비스를 이용하세요</p>
        </div>
    </section>

    <!-- Login Form Section -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="login-card">
                        <h2 class="text-center mb-4 text-dark">로그인</h2>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label text-dark">이메일 주소</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label text-dark">비밀번호</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label text-dark" for="rememberMe">
                                        로그인 상태 유지
                                    </label>
                                </div>
                            </div>
                            <div class="forgot-password">
                                <a href="/forgot-password">비밀번호를 잊으셨나요?</a>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-custom btn-lg">
                                    <i class="fas fa-sign-in-alt me-2"></i>로그인
                                </button>
                            </div>
                        </form>
                        
                        <div class="social-login">
                            <p class="text-center text-muted mb-3">또는</p>
                            <button class="btn social-btn btn-google" onclick="socialLogin('google')">
                                <i class="fab fa-google me-2"></i>Google로 로그인
                            </button>
                            <button class="btn social-btn btn-facebook" onclick="socialLogin('facebook')">
                                <i class="fab fa-facebook-f me-2"></i>Facebook으로 로그인
                            </button>
                            <button class="btn social-btn btn-kakao" onclick="socialLogin('kakao')">
                                <i class="fas fa-comment me-2"></i>카카오로 로그인
                            </button>
                        </div>
                        
                        <hr class="my-4">
                        <div class="text-center">
                            <p class="text-muted mb-0">계정이 없으신가요? 
                                <a href="/signup" class="text-decoration-none">회원가입하기</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5><i class="fas fa-utensils me-2"></i>레스토랑 예약 시스템</h5>
                    <p class="text-muted">최고의 레스토랑 예약 경험을 제공합니다.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <h6>연락처</h6>
                    <p class="text-muted">
                        <i class="fas fa-phone me-2"></i>02-1234-5678<br>
                        <i class="fas fa-envelope me-2"></i>info@restaurant-reservation.com
                    </p>
                </div>
            </div>
            <hr class="my-4">
            <div class="text-center">
                <p class="text-muted mb-0">&copy; 2024 레스토랑 예약 시스템. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 로그인 폼 제출 처리
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                rememberMe: document.getElementById('rememberMe').checked
            };

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // 토큰을 로컬 스토리지에 저장
                    if (data.token) {
                        localStorage.setItem('authToken', data.token);
                        localStorage.setItem('userEmail', data.email);
                        localStorage.setItem('userName', data.name);
                    }
                    
                    alert('로그인이 성공적으로 완료되었습니다!');
                    window.location.href = '/'; // 메인 페이지로 이동
                } else {
                    const errorData = await response.json();
                    alert(`로그인 실패: ${errorData.message || '이메일 또는 비밀번호가 올바르지 않습니다.'}`);
                }
            } catch (error) {
                console.error('로그인 실패:', error);
                alert('로그인 중 오류가 발생했습니다.');
            }
        });

        // 소셜 로그인 처리
        function socialLogin(provider) {
            // 실제 구현에서는 각 소셜 로그인 API를 호출
            alert(`${provider} 로그인 기능은 개발 중입니다.`);
        }

        // 페이지 로드 시 로그인 상태 확인
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('authToken');
            if (token) {
                // 이미 로그인된 상태라면 메인 페이지로 리다이렉트
                window.location.href = '/';
            }
        });

        // Enter 키로 로그인
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
